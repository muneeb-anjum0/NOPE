name: Core CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-tests:
    name: Backend / API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt

      - name: Run API regression suite
        run: python -m pytest apps/api/tests -q

      - name: Summarize API proof
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend / API proof"
            echo ""
            echo "- Command: \`python -m pytest apps/api/tests -q\`"
            echo "- Covers scan events, pipeline, scanners, findings lifecycle, Qwen/RAG contracts, GitHub mocks, persistence, self-security, and repository intelligence."
          } >> "$GITHUB_STEP_SUMMARY"

  api-lint:
    name: Backend / Ruff correctness lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff>=0.5.0"

      - name: Run Ruff
        run: ruff check --select F apps/api/nope_api apps/api/tests

  web-static:
    name: Frontend / lint typecheck build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm web:lint

      - name: Run typecheck
        run: pnpm web:typecheck

      - name: Build web app
        run: pnpm web:build

      - name: Summarize frontend proof
        if: always()
        shell: bash
        run: |
          {
            echo "## Frontend proof"
            echo ""
            echo "- Lint: \`pnpm web:lint\`"
            echo "- TypeScript: \`pnpm web:typecheck\`"
            echo "- Production build: \`pnpm web:build\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-compose-build:
    name: Docker / compose and image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOPE_MODEL_HOST_DIR: /tmp/nope-models
      NOPE_EMBEDDING_MODEL_HOST_DIR: /tmp/nope-embeddings
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare model mount placeholders
        run: mkdir -p "$NOPE_MODEL_HOST_DIR" "$NOPE_EMBEDDING_MODEL_HOST_DIR"

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build canonical app images
        run: docker compose build nope-api nope-worker nope-runner nope-web

      - name: Summarize Docker proof
        if: always()
        shell: bash
        run: |
          {
            echo "## Docker proof"
            echo ""
            echo "- Compose syntax and interpolation: \`docker compose config --quiet\`"
            echo "- Built services: \`nope-api\`, \`nope-worker\`, \`nope-runner\`, \`nope-web\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rules-docs-proof:
    name: Rules and docs / catalog proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate rule catalog and docs anchors
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path(".")
          core_path = root / "security-packs" / "nope-core-rules.json"
          semgrep_path = root / "security-packs" / "semgrep" / "nope.yml"
          readme = (root / "README.md").read_text(encoding="utf-8")
          testing = (root / "docs" / "TESTING.md").read_text(encoding="utf-8")

          rules = json.loads(core_path.read_text(encoding="utf-8"))
          ids = [rule.get("id") for rule in rules]
          required = {"id", "title", "severity", "confidence", "category", "description", "remediation", "test_guidance", "patterns"}
          missing = {rule.get("id", "<missing id>"): sorted(required - set(rule)) for rule in rules if required - set(rule)}
          empty_patterns = [rule.get("id", "<missing id>") for rule in rules if not rule.get("patterns")]
          duplicate_ids = sorted({rule_id for rule_id in ids if ids.count(rule_id) > 1})
          semgrep_rules = re.findall(r"(?m)^\s*-\s+id:\s+", semgrep_path.read_text(encoding="utf-8"))

          assert len(rules) >= 35, f"expected at least 35 NOPE rules, found {len(rules)}"
          assert not missing, f"rules missing required fields: {missing}"
          assert not empty_patterns, f"rules missing detection patterns: {empty_patterns}"
          assert not duplicate_ids, f"duplicate NOPE rule ids: {duplicate_ids}"
          assert semgrep_rules, "Semgrep NOPE ruleset has no rules"
          for phrase in ["RAG", "Rules v2", "scanner-only benchmark", "Qwen"]:
            assert phrase in readme, f"README missing {phrase}"
          for phrase in ["pytest", "Playwright", "docker compose", "Benchmarks"]:
            assert phrase in testing, f"docs/TESTING.md missing {phrase}"

          summary = Path("rules-docs-proof.md")
          summary.write_text(
              "\\n".join(
                  [
                      "# Rules and docs proof",
                      "",
                      f"- Structured NOPE rules: {len(rules)}",
                      f"- Semgrep rules: {len(semgrep_rules)}",
                      "- Rule IDs are unique.",
                      "- Required rule metadata fields are present.",
                      "- README covers RAG, Rules v2, benchmark proof, and Qwen.",
                      "- docs/TESTING.md covers pytest, Playwright, Docker Compose, and benchmarks.",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          print(summary.read_text(encoding="utf-8"))
          PY

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          if [ -f rules-docs-proof.md ]; then
            cat rules-docs-proof.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-docs-proof
          path: rules-docs-proof.md
          if-no-files-found: error
