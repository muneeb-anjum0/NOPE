name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Run browser E2E, accessibility, and visual regression
        env:
          NOPE_E2E_FIXTURE: "1"
        run: pnpm web:e2e

      - name: Summarize browser proof artifacts
        if: always()
        shell: bash
        run: |
          {
            echo "## Browser E2E proof bundle"
            echo ""
            echo "- Flow, accessibility, and visual regression tests run through \`pnpm web:e2e\`."
            echo "- Full HTML report is uploaded as the \`playwright-report\` artifact."
            echo "- Raw screenshots, videos, and traces are uploaded as the \`playwright-test-results\` artifact."
            echo ""
            echo "### Captured result files"
            if [ -d apps/web/test-results ]; then
              find apps/web/test-results -maxdepth 3 -type f | sort | sed 's#^#- #'
            else
              echo "- No Playwright result files were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
