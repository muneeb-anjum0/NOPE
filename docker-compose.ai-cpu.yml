services:
  nope-api:
    environment:
      NOPE_AI_PROVIDER: llama.cpp
      NOPE_AI_RUNTIME_URL: http://nope-ai:8080
      NOPE_QWEN_ENDPOINT: http://nope-ai:8080
      NOPE_AI_GPU_LAYERS: "0"
      NOPE_QWEN_GPU_LAYERS: "0"
    depends_on:
      nope-ai:
        condition: service_healthy

  nope-worker:
    environment:
      NOPE_AI_PROVIDER: llama.cpp
      NOPE_AI_RUNTIME_URL: http://nope-ai:8080
      NOPE_QWEN_ENDPOINT: http://nope-ai:8080
      NOPE_AI_GPU_LAYERS: "0"
      NOPE_QWEN_GPU_LAYERS: "0"
    depends_on:
      nope-ai:
        condition: service_healthy

  nope-ai:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles:
      - ai-cpu
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/${NOPE_MODEL_FILE:-Qwen3-8B-Q4_K_M.gguf}"
      - "--ctx-size"
      - "${NOPE_QWEN_CONTEXT_SIZE:-4096}"
      - "--batch-size"
      - "${NOPE_QWEN_BATCH_SIZE:-256}"
      - "--n-gpu-layers"
      - "0"
      - "--threads"
      - "${NOPE_QWEN_THREADS:-8}"
      - "--parallel"
      - "${NOPE_QWEN_PARALLEL:-1}"
    environment:
      LLAMA_ARG_N_GPU_LAYERS: "0"
